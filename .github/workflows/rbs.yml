name: rbs

on:
  pull_request:
  push:
    branches: [main]
  # Weekly rebuild on main so base-image updates ship, as the legacy workflow did.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: rbs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    uses: ReduxISU/Redux_Build_System/.github/workflows/ci.yml@main
    secrets: inherit
