name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — catches base image updates

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # Catch a pyproject.toml edit that was committed without running
      # `uv lock`. The Dockerfile's `uv sync --locked` would also fail, but
      # this gives a clear message before a full image build.
      - name: Check lock is current
        run: uv lock --check

      - uses: docker/login-action@v4.5.2
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default docker driver can't export build cache (cache-to: gha
      # below fails with "Cache export is not supported for the docker
      # driver"); the docker-container driver can, and still supports load.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # Build and load locally first. Nothing is pushed until the smoke test
      # below proves the image actually starts.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: ./test_image_smoke.sh "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"

      # Re-runs the build from cache, so this is a push of the exact image the
      # smoke test just validated.
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - uses: actions/delete-package-versions@v5
        if: github.event_name != 'pull_request'
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
